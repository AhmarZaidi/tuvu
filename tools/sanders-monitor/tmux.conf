# Sanders headless-server status bar.
# Source this file from ~/.tmux.conf after installing sanders-status.

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-left-length 20
set -g status-right-length 180
set -g status-left ' #S '
set -g status-right '#($HOME/.local/bin/sanders-status) | %Y-%m-%d %H:%M '
